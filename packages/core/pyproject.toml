[project]
name = "emojilens-core"
version = "0.1.0"
description = "EmojiLens research engine: Unicode forensics, transformations, evaluation."
requires-python = ">=3.11,<3.13"
dependencies = [
    "confusable-homoglyphs>=3.3.1",
    "emoji>=2.12",
    "pillow>=10.4",
    "pydantic>=2.8",
    "regex>=2024.5.15",
]

[project.optional-dependencies]
# Install on the target machine only (see docs/MODEL_SETUP_M4.md).
models = [
    "torch>=2.4",
    "transformers>=4.46",
    "sentence-transformers>=3.2",
    "huggingface_hub>=0.26",
]
learn = [
    "scikit-learn>=1.5",
    "joblib>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emojilens_core"]
