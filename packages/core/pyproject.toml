[project]
name = "emojilens-core"
version = "0.1.0"
description = "EmojiLens research engine: Unicode forensics, transformations, evaluation."
requires-python = ">=3.11,<3.13"
dependencies = [
    "confusable-homoglyphs>=3.3.1",
    "emoji>=2.12",
    "pydantic>=2.8",
    "regex>=2024.5.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emojilens_core"]
