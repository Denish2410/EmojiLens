[project]
name = "emojilens-api"
version = "0.1.0"
description = "EmojiLens versioned FastAPI service."
requires-python = ">=3.11,<3.13"
dependencies = [
    "emojilens-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.32",
    "alembic>=1.13",
]

[tool.uv.sources]
emojilens-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emojilens_api"]
